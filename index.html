<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spaghetti Dance">
<meta name="description" content="Listado de artistas y temas del Spaghetti Dance / Italo disco de los 80, ordenado por éxito.">
<title>Spaghetti Dance</title>
<style>
:root{
  --bg:#0d0f12; --panel:#15181d; --panel2:#1b1f26; --line:#272d36;
  --fg:#e9ecf1; --dim:#8b949f; --dim2:#646d78;
  --acc:#ff4d8d; --acc2:#35d0e8; --gold:#f5c451;
  --radius:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(40px + var(--safe-b));
  overflow-wrap:anywhere;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- Cabecera fija ---------- */
header{
  position:sticky; top:0; z-index:30;
  background:rgba(13,15,18,.92);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + var(--safe-t)) 12px 0;
}
.brand{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.brand h1{
  margin:0;font-size:17px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand span{font-size:11px;color:var(--dim2);letter-spacing:.06em}

.searchbar{display:flex;gap:8px;align-items:center}
.searchwrap{position:relative;flex:1}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
#q{
  width:100%; padding:11px 34px 11px 34px;
  background:var(--panel2); border:1px solid var(--line); border-radius:11px;
  color:var(--fg); font-size:16px; outline:none;
}
#q:focus{border-color:var(--acc)}
#q::placeholder{color:var(--dim2)}
.clearq{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;color:var(--dim);font-size:17px;line-height:1;
  display:none;align-items:center;justify-content:center;
}
.clearq.on{display:flex}
.hidbtn{
  position:relative;flex:0 0 auto;padding:10px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--panel2);color:var(--dim);font-size:14px;
}
.hidbtn b{color:var(--fg);font-weight:600}

nav{display:flex;gap:4px;margin:8px -12px 0;padding:0 12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;padding:9px 14px 11px;color:var(--dim);font-size:13px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid transparent;
}
nav button.on{color:var(--fg);border-bottom-color:var(--acc)}

/* ---------- Cuerpo ---------- */
main{padding:10px 12px 0;max-width:820px;margin:0 auto}
.count{color:var(--dim2);font-size:12px;margin:6px 2px 12px;letter-spacing:.03em}
.empty{color:var(--dim);text-align:center;padding:54px 16px;font-size:14px}

.group{margin:0 0 8px}
.ghead{
  position:sticky;top:var(--stick,0px);z-index:5;
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 12px;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;
}
.ghead:hover{border-color:var(--dim2)}
.ghead.on{border-color:var(--acc);border-bottom-left-radius:0;border-bottom-right-radius:0}
.ghead .gt{flex:1;font-size:15px;font-weight:700;letter-spacing:.04em}
.ghead em{font-style:normal;color:var(--dim2);font-size:12px}
.chev{flex:0 0 auto;color:var(--dim2);transition:transform .18s ease}
.ghead.on .chev{transform:rotate(90deg);color:var(--acc)}
.gbody{
  border:1px solid var(--acc);border-top:0;border-radius:0 0 12px 12px;
  padding:6px 8px 8px;margin-top:-1px;
}
.gbody .flat{border:0;border-radius:0;background:none;padding:0 4px}
.gbody .card{background:var(--panel2)}

/* ---------- Ficha de artista ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px;margin-bottom:9px;
}
.card.fav{border-color:rgba(245,196,81,.5);box-shadow:inset 0 0 0 1px rgba(245,196,81,.12)}
.chead{display:flex;align-items:center;gap:11px}
.cover{
  flex:0 0 auto;width:46px;height:46px;border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:800;color:#0b0d10;letter-spacing:.02em;
  background:var(--panel2);
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cmeta{flex:1;min-width:0}
.cname{font-size:15px;font-weight:700;line-height:1.25}
.cname .no{color:var(--dim2);font-weight:600;margin-right:3px}
.csub{font-size:12px;color:var(--dim);margin-top:2px}
.csub .star{color:var(--gold)}
.cacts{flex:0 0 auto;display:flex;gap:2px}

.mk{width:32px;height:32px;border-radius:9px;color:var(--dim2);font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center}
.mk:hover{background:var(--panel2);color:var(--fg)}
.mk.on{color:var(--gold)}

.tracks{margin:9px 0 0;padding:0;list-style:none}
.card .tracks{border-top:1px solid var(--line);padding-top:4px}
.trk{display:flex;align-items:center;gap:9px;padding:6px 2px;min-height:34px}
.trk + .trk{border-top:1px solid rgba(39,45,54,.55)}
.tn{flex:0 0 auto;min-width:34px;color:var(--dim2);font-size:11px;font-variant-numeric:tabular-nums;text-align:right}
.tt{flex:1;min-width:0;font-size:14px}
.tt small{display:block;color:var(--dim);font-size:12px;margin-top:1px}
.ty{flex:0 0 auto;color:var(--dim2);font-size:11px;font-variant-numeric:tabular-nums}
.trk.fav .tt{color:var(--gold)}
.sp{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;color:var(--dim);
}
.sp:hover{border-color:var(--acc2);color:var(--acc2)}
.sp.direct{border-color:rgba(53,208,232,.45);color:var(--acc2)}

/* lista plana de temas */
.flat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 10px}
.flat .trk{padding:8px 2px}

/* ---------- Panel de ocultos ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;z-index:41;right:0;bottom:0;left:0;max-height:82vh;
  background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;display:none;flex-direction:column;
  padding-bottom:var(--safe-b);
}
.sheet.on{display:flex}
.shead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.shead h2{margin:0;font-size:15px;font-weight:700}
.sbody{overflow:auto;padding:10px 16px 20px;-webkit-overflow-scrolling:touch}
.sbody h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin:14px 0 6px}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(39,45,54,.6)}
.hrow .t{flex:1;min-width:0;font-size:14px}
.hrow .t small{display:block;color:var(--dim);font-size:12px}
.undo{flex:0 0 auto;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--dim)}
.undo:hover{border-color:var(--acc);color:var(--fg)}
.snote{color:var(--dim2);font-size:12px;padding:10px 0 0}
@media (min-width:760px){
  .sheet{left:auto;top:0;bottom:0;width:420px;max-height:none;border-radius:0;border-left:1px solid var(--line)}
}
</style>
</head>

/* ---------- utilidades ---------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');
const esc  = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initial = s => { const m = s.toUpperCase().match(/[A-Z0-9ÁÉÍÓÚÜÑ]/); return m ? m[0] : '·'; };
const hue = s => { let h=0; for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; };

/* índices y claves precalculadas */
const ARTISTS = DATA.map((a,i) => ({...a, i, key:norm(a.a), ini:initial(a.a), h:hue(a.a)}));
const TRACKS  = [];
ARTISTS.forEach(a => a.t.forEach(t => {
  t.art = a;            // mismo objeto en la ficha del artista y en las listas planas
  t.ord = TRACKS.length; // orden del contador B (mayor a menor éxito)
  t.key = norm(t.t);
  t.akey = a.key;
  TRACKS.push(t);
}));

const spotify = (art,t) => t.sp
  ? 'https://open.spotify.com/track/' + t.sp
  : 'https://open.spotify.com/search/' + encodeURIComponent(art.a + ' ' + t.t);

/* ---------- estado ----------
   En el navegador SÓLO se guardan los ocultos: al volver a abrir la página
   siguen apartados. Todo lo demás arranca de cero en cada visita —
   los favoritos y los grupos desplegados viven únicamente en esta sesión. */
const KEY = 'spaghetti-dance-v1';
const S = {favA:new Set(),favT:new Set(),hidA:new Set(),hidT:new Set()};
try{
  const raw = JSON.parse(localStorage.getItem(KEY)||'{}');
  ['hidA','hidT'].forEach(k => (raw[k]||[]).forEach(v => S[k].add(v)));
}catch(e){}
const save = () => { try{
  localStorage.setItem(KEY, JSON.stringify({hidA:[...S.hidA], hidT:[...S.hidT]}));
}catch(e){} };

const OPEN = new Set();          // grupos desplegados a mano (sólo esta sesión)
let view = 'artistas', query = '';

/* ---------- filtros ---------- */
const visibleArtists = () => {
  const q = norm(query);
  return ARTISTS.filter(a => {
    if (S.hidA.has(a.n)) return false;
    if (!q) return true;
    return a.key.includes(q) || a.t.some(t => norm(t.t).includes(q));
  });
};
/* temas que se muestran dentro de una ficha: todos si coincide el artista,
   sólo los que coinciden si la búsqueda apunta al título */
const cardTracks = a => {
  const q = norm(query);
  const ts = a.t.filter(t => !S.hidT.has(t.n));
  if (!q || a.key.includes(q)) return ts;
  return ts.filter(t => norm(t.t).includes(q));
};
const visibleTracks = () => {
  const q = norm(query);
  return TRACKS.filter(t => {
    if (S.hidT.has(t.n) || S.hidA.has(t.art.n)) return false;
    if (!q) return true;
    return t.key.includes(q) || t.akey.includes(q);
  });
};
/* favoritos arriba, conservando el orden original */
const favFirst = (arr, isFav) => {
  const f = [], r = [];
  arr.forEach(x => (isFav(x) ? f : r).push(x));
  return f.concat(r);
};

/* ---------- plantillas ---------- */
function coverHTML(a){
  if (a.img) return `<div class="cover"><img src="${esc(a.img)}" alt="${esc(a.a)}" loading="lazy"></div>`;
  return `<div class="cover" style="background:linear-gradient(145deg,hsl(${a.h} 72% 64%),hsl(${(a.h+38)%360} 76% 52%))">${esc(a.ini)}</div>`;
}
function trackHTML(t, withMarks){
  const fav = S.favT.has(t.n);
  return `<li class="trk${fav?' fav':''}">
    <span class="tn">${esc(t.n)}.</span>
    <span class="tt">${esc(t.t)}${withMarks?`<small>${esc(t.art.a)}</small>`:''}</span>
    <span class="ty">${t.y}</span>
    <a class="sp${t.sp?' direct':''}" href="${spotify(t.art,t)}" target="_blank" rel="noopener"
       title="${t.sp?'Abrir en Spotify':'Buscar en Spotify'}" aria-label="Spotify">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1l8 5-8 5z"/></svg>
    </a>
    ${withMarks?`<button class="mk${fav?' on':''}" data-ft="${esc(t.n)}" title="Favorito">${fav?'★':'☆'}</button>
    <button class="mk" data-ht="${esc(t.n)}" title="Ocultar">⊘</button>`:''}
  </li>`;
}
function cardHTML(a){
  const fav = S.favA.has(a.n);
  const ts = cardTracks(a);
  return `<article class="card${fav?' fav':''}">
    <div class="chead">
      ${coverHTML(a)}
      <div class="cmeta">
        <div class="cname"><span class="no">${esc(a.n)}.</span>${esc(a.a)}</div>
        <div class="csub">${esc(a.c)} · ${a.t.length} tema${a.t.length>1?'s':''}${fav?' · <span class="star">★</span>':''}</div>
      </div>
      <div class="cacts">
        <button class="mk${fav?' on':''}" data-fa="${esc(a.n)}" title="Favorito">${fav?'★':'☆'}</button>
        <button class="mk" data-ha="${esc(a.n)}" title="Ocultar">⊘</button>
      </div>
    </div>
    ${ts.length?`<ul class="tracks">${ts.map(t=>trackHTML(t,false)).join('')}</ul>`:''}
  </article>`;
}

/* ---------- vistas ---------- */
function viewArtistas(){
  const as = favFirst(visibleArtists(), a => S.favA.has(a.n));
  if (!as.length) return ['', 0];
  return [as.map(cardHTML).join(''), as.length];
}
function viewTemas(){
  const ts = favFirst(visibleTracks(), t => S.favT.has(t.n));
  if (!ts.length) return ['', 0];
  return [`<ul class="tracks flat">${ts.map(t=>trackHTML(t,true)).join('')}</ul>`, ts.length];
}
/* Grupo plegable. Con el buscador en uso se abre solo: si no, verías la
   cabecera cerrada y no lo que has buscado. Al borrar la búsqueda vuelve
   a su estado y sólo siguen abiertos los que hayas desplegado tú. */
function groupHTML(key, title, sub, body){
  const on = !!query || OPEN.has(key);
  return `<section class="group">
    <button class="ghead${on?' on':''}" data-g="${esc(key)}" aria-expanded="${on}">
      <svg class="chev" width="11" height="11" viewBox="0 0 10 10" aria-hidden="true">
        <path d="M3.2 1L7 5 3.2 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="gt">${esc(title)}</span><em>${esc(sub)}</em>
    </button>
    ${on ? `<div class="gbody">${body()}</div>` : ''}
  </section>`;
}

function viewAnos(){
  const ts = visibleTracks();
  if (!ts.length) return ['', 0];
  const by = new Map();
  ts.forEach(t => (by.get(t.y) || by.set(t.y,[]).get(t.y)).push(t));
  const years = [...by.keys()].sort((x,y)=>x-y);
  const html = years.map(y => {
    const list = favFirst(by.get(y), t => S.favT.has(t.n));
    return groupHTML('y:'+y, String(y), `${list.length} tema${list.length>1?'s':''}`,
      () => `<ul class="tracks flat">${list.map(t=>trackHTML(t,true)).join('')}</ul>`);
  }).join('');
  return [html, ts.length];
}
function viewPaises(){
  const as = visibleArtists();
  if (!as.length) return ['', 0];
  const by = new Map();
  as.forEach(a => (by.get(a.c) || by.set(a.c,[]).get(a.c)).push(a));
  /* el país hereda la posición de su artista mejor situado en el ranking */
  const rank = c => Math.min(...by.get(c).map(a => a.n === '0' ? Infinity : +a.n));
  const countries = [...by.keys()].sort((x,y) => rank(x)-rank(y) || x.localeCompare(y,'es'));
  const html = countries.map(c => {
    const list = favFirst(by.get(c), a => S.favA.has(a.n));
    return groupHTML('c:'+c, c, `${list.length} artista${list.length>1?'s':''}`,
      () => list.map(cardHTML).join(''));
  }).join('');
  return [html, as.length];
}

const LABEL = {artistas:'artista', temas:'tema', anos:'tema', paises:'artista'};
function render(toTop){
  const [html, n] = {artistas:viewArtistas, temas:viewTemas, anos:viewAnos, paises:viewPaises}[view]();
  const app = document.getElementById('app');
  app.innerHTML = html || `<p class="empty">Nada coincide con «${esc(query)}».</p>`;
  const hid = S.hidA.size + S.hidT.size;
  document.getElementById('count').textContent =
    n ? `${n} ${LABEL[view]}${n>1?'s':''}${query?' encontrados':''}${hid?` · ${hid} oculto${hid>1?'s':''}`:''}` : '';
  document.getElementById('hidn').textContent = hid;
  if (toTop) window.scrollTo({top:0});
}

/* la cabecera es fija: los títulos de grupo se pegan justo debajo de ella */
const measure = () => document.documentElement.style
  .setProperty('--stick', document.querySelector('header').offsetHeight + 'px');
addEventListener('resize', measure);

/* ---------- panel de ocultos ---------- */
function renderHidden(){
  const as = ARTISTS.filter(a => S.hidA.has(a.n));
  const ts = TRACKS.filter(t => S.hidT.has(t.n));
  let h = '';
  if (as.length) h += `<h3>Artistas (${as.length})</h3>` + as.map(a =>
    `<div class="hrow"><div class="t">${esc(a.a)}<small>${esc(a.c)} · ${a.t.length} temas</small></div>
     <button class="undo" data-ua="${esc(a.n)}">Mostrar</button></div>`).join('');
  if (ts.length) h += `<h3>Temas (${ts.length})</h3>` + ts.map(t =>
    `<div class="hrow"><div class="t">${esc(t.t)}<small>${esc(t.art.a)} · ${t.y}</small></div>
     <button class="undo" data-ut="${esc(t.n)}">Mostrar</button></div>`).join('');
  if (!h) h = `<p class="snote">No has ocultado nada todavía. Con el botón ⊘ de cada artista o tema lo apartas de la lista principal; desde aquí vuelve.</p>`;
  document.getElementById('hidbody').innerHTML = h;
}
const openSheet = v => {
  document.getElementById('sheet').classList.toggle('on', v);
  document.getElementById('scrim').classList.toggle('on', v);
  if (v) renderHidden();
};

/* ---------- eventos ---------- */
const qEl = document.getElementById('q');
let tmr;
qEl.addEventListener('input', () => {
  document.getElementById('clearq').classList.toggle('on', !!qEl.value);
  clearTimeout(tmr);
  tmr = setTimeout(() => { query = qEl.value.trim(); render(true); }, 90);
});
document.getElementById('clearq').addEventListener('click', () => {
  qEl.value=''; query=''; document.getElementById('clearq').classList.remove('on'); render(true); qEl.focus();
});
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x===b));
  view = b.dataset.v; render(true);
});
document.getElementById('app').addEventListener('click', e => {
  const g = e.target.closest('button[data-g]');
  if (g){
    const k = g.dataset.g;
    OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k);
    render();
    return;
  }
  const b = e.target.closest('button[data-fa],button[data-ha],button[data-ft],button[data-ht]');
  if (!b) return;
  const d = b.dataset;
  if (d.fa !== undefined) S.favA.has(d.fa) ? S.favA.delete(d.fa) : S.favA.add(d.fa);
  if (d.ft !== undefined) S.favT.has(d.ft) ? S.favT.delete(d.ft) : S.favT.add(d.ft);
  if (d.ha !== undefined){ S.hidA.add(d.ha); S.favA.delete(d.ha); }
  if (d.ht !== undefined){ S.hidT.add(d.ht); S.favT.delete(d.ht); }
  save(); render();
});
document.getElementById('hidbody').addEventListener('click', e => {
  const b = e.target.closest('button[data-ua],button[data-ut]'); if (!b) return;
  if (b.dataset.ua !== undefined) S.hidA.delete(b.dataset.ua);
  if (b.dataset.ut !== undefined) S.hidT.delete(b.dataset.ut);
  save(); renderHidden(); render();
});
document.getElementById('openhid').addEventListener('click', () => openSheet(true));
document.getElementById('closehid').addEventListener('click', () => openSheet(false));
document.getElementById('scrim').addEventListener('click', () => openSheet(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ openSheet(false); if (document.activeElement === qEl){ qEl.blur(); } }
});

measure();
render();
</script>
</body>
</html>
